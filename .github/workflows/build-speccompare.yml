name: Build and publish SpecCompare Windows
on:
  workflow_dispatch:
  push:
    branches: [speccompare-download]
    paths:
      - 'speccompare/**'
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'assets/**'
      - 'packaging/**'
      - '.github/workflows/build-speccompare.yml'
permissions:
  contents: read
concurrency:
  group: speccompare-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and GUI tests (failure blocks build and publication)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build onedir, ZIP, and verify extracted EXE without development PATH
        run: python packaging/build_windows.py
      - name: Optional Inno Setup installer and installation verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $dist = Join-Path $PWD 'dist/windows-v1.2.0'
          $reportPath = Join-Path $dist 'build-report.json'
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($iscc) {
            & $iscc "/DAppSource=$dist\SpecCompare" "/DInstallerOutput=$dist" packaging/windows/installer.iss
            if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
            $installDir = Join-Path $env:RUNNER_TEMP '설치 검증\SpecCompare'
            $setup = Join-Path $dist 'SpecCompare_Setup_v1.2.0.exe'
            $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$installDir`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Installer execution failed' }
            $env:QT_QPA_PLATFORM = 'offscreen'
            $out = Join-Path $env:RUNNER_TEMP '설치 후 검증'
            $process = Start-Process "$installDir\SpecCompare.exe" -ArgumentList @('--self-test',"`"$out`"") -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path "$out\self-test.json")) { throw 'Installed app self-test failed' }
            $report.installer = 'Inno Setup: built, installed, packaged self-test passed'
          } else {
            $report.installer = 'Not built: Inno Setup compiler not available; portable ZIP verified'
          }
          $report | ConvertTo-Json -Depth 15 | Set-Content -Encoding utf8 $reportPath
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: SpecCompare-Windows-v1.2.0
          path: |
            dist/windows-v1.2.0/SpecCompare_Windows_v1.2.0.zip
            dist/windows-v1.2.0/SpecCompare_Windows_v1.2.0.zip.sha256
            dist/windows-v1.2.0/build-report.json
            dist/windows-v1.2.0/SpecCompare_Setup_v1.2.0.exe
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpecCompare-build-diagnostics
          path: |
            build/windows-native/**/warn-*.txt
            dist/windows-v1.2.0/build-report.json
            dist/windows-v1.2.0/ZIP 압축 해제 검증/검증 결과/self-test.json
            dist/windows-v1.2.0/ZIP 압축 해제 검증/검증 결과/self-test-error.txt
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.ref == 'refs/heads/speccompare-download'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: speccompare-download
      - uses: actions/download-artifact@v4
        with:
          name: SpecCompare-Windows-v1.2.0
          path: release-artifacts
      - name: Publish without replacing unrelated files and verify public checksums
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python packaging/publish_windows.py
